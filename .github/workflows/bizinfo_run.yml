name: Run Bizinfo Excel Generator

on:
  workflow_dispatch: # 깃허브 웹페이지에서 [Run workflow] 버튼을 눌러 수동 실행 가능
  schedule:
    - cron: '30 21 * * *' # 매일 아침 자동 실행 (UTC 기준, 한국 시간 오전 6시 30분)

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas openpyxl urllib3

      - name: Run python script
        run: |
          python bizinfo_excel.py
